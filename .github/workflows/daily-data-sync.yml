name: Daily Data Sync

# Run daily at 9 AM KST (0 AM UTC) and allow manual trigger
on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC (9 AM KST)
  workflow_dispatch:
    inputs:
      target_cafe:
        description: "Target specific cafe (optional)"
        required: false
        type: choice
        options:
          - "all"
          - "starbucks"
          # - "compose" # blocked in CI, synced via Render cron
          - "mega"
          - "paik"
          - "ediya"
          # - 'twosome' # blocks all cloud IPs, must sync manually
          - "coffeebean"
          - "hollys"
          - "paulbassett"
          - "mammoth"
          - "gongcha"
          # - "oozy" # blocked in CI, synced via Render cron
          - "theventi"
        default: "all"

jobs:
  # One job per cafe runs crawl → categorize → upload back to back. Job minutes
  # are rounded up per job, so separate categorize/upload jobs (~20s each) cost
  # a full minute apiece plus a repeated checkout and install.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Slowest crawler (starbucks) takes ~11 min
    strategy:
      matrix:
        cafe: ${{ (github.event.inputs.target_cafe == 'all' || github.event.inputs.target_cafe == '' || !github.event.inputs.target_cafe) && fromJSON('["starbucks", "mega", "paik", "ediya", "coffeebean", "hollys", "paulbassett", "mammoth", "gongcha", "theventi", "angelinus"]') || fromJSON(format('["{0}"]', github.event.inputs.target_cafe)) }}
      fail-fast: false # Don't cancel other jobs if one fails
      max-parallel: 4 # Limit concurrent crawlers to avoid rate limiting

    name: Sync ${{ matrix.cafe }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Crawlers that fetch pages over plain HTTP don't need a browser
      - name: Check if crawler needs a browser
        id: browser
        run: |
          if grep -q "playwright\|PlaywrightCrawler" "actors/crawler/${{ matrix.cafe }}-crawler.ts"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v4
        id: playwright_cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.browser.outputs.needed == 'true' && steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Create crawler outputs directory
        run: mkdir -p actors/crawler/crawler-outputs

      - name: Crawl ${{ matrix.cafe }}
        run: |
          pnpm run crawl ${{ matrix.cafe }} || {
            echo "❌ Crawler failed for ${{ matrix.cafe }}"
            echo "Possible causes: site returned 403 (blocked), network error, or no products found"
            ls -la actors/crawler/crawler-outputs/ 2>/dev/null || echo "No crawler-outputs directory"
            exit 1
          }
          echo "✅ Crawler output found for ${{ matrix.cafe }}"
          ls -la actors/crawler/crawler-outputs/${{ matrix.cafe }}-*.json
        env:
          NODE_ENV: production
          CI: true

      - name: Categorize ${{ matrix.cafe }}
        run: pnpm run categorize ${{ matrix.cafe }}
        env:
          NODE_ENV: production

      - name: Upload ${{ matrix.cafe }} to database
        run: pnpm run upload ${{ matrix.cafe }}
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CONVEX_UPLOAD_SECRET: ${{ secrets.CONVEX_UPLOAD_SECRET }}

      # Keep whatever output exists so a failed categorize/upload can be
      # inspected or re-uploaded locally.
      - name: Upload crawler output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output-${{ matrix.cafe }}
          path: actors/crawler/crawler-outputs/${{ matrix.cafe }}-*.json
          if-no-files-found: ignore
          retention-days: 7

      # Crawlers that dump the rendered page on failure make a site structure
      # change diagnosable without re-running locally.
      - name: Upload debug page dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-debug-${{ matrix.cafe }}
          path: actors/crawler/crawler-outputs/*debug*
          if-no-files-found: ignore
          retention-days: 7

  # Summarize and surface failures. Scheduled runs failed silently for weeks
  # before, so failures are tracked in a single open issue.
  summary:
    runs-on: ubuntu-latest
    needs: [sync]
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write

    name: Summary

    steps:
      - name: Generate summary and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RESULT: ${{ needs.sync.result }}
          TARGET: ${{ github.event.inputs.target_cafe || 'all' }}
        run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Sync ")) | select(.conclusion == "failure" or .conclusion == "timed_out") | .name | sub("^Sync "; "")')

          {
            echo "## Daily Data Sync Summary"
            echo ""
            echo "- Sync: $SYNC_RESULT"
            echo "- Target: $TARGET"
            echo "- Timestamp: $(date -u)"
            echo ""
            if [[ -n "$failed" ]]; then
              echo "❌ Failed cafes:"
              echo "$failed" | sed 's/^/- /'
            elif [[ "$SYNC_RESULT" == "success" ]]; then
              echo "✅ All cafes synced successfully!"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$failed" ]]; then
            exit 0
          fi

          title="Daily Data Sync failures"
          body=$(printf 'Run: %s\n\nFailed cafes:\n%s\n' "$RUN_URL" "$(echo "$failed" | sed 's/^/- /')")
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
